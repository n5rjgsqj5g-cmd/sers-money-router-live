<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Angebot-Nachfass-Kit für Freelancer</title>
  <desc id="desc">Vier sachliche Vorlagen: Angebot versenden, nachfassen, Umfang klären und freundlich schließen.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102a24"/><stop offset="1" stop-color="#087466"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#061e1a" flood-opacity=".3"/></filter></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><circle cx="1110" cy="82" r="220" fill="#dff7a9" opacity=".12"/><circle cx="85" cy="592" r="200" fill="#dff7a9" opacity=".08"/>
  <g font-family="Inter,Arial,sans-serif"><text x="72" y="80" fill="#dff7a9" font-size="22" font-weight="800" letter-spacing="3">SERS PRACTICAL KITS</text><text x="72" y="194" fill="#fff" font-size="66" font-weight="800" letter-spacing="-3">Nachfassen,</text><text x="72" y="270" fill="#fff" font-size="66" font-weight="800" letter-spacing="-3">ohne zu drängen.</text><text x="72" y="336" fill="#d7e5df" font-size="30">Vier Vorlagen für Freelancer-Angebote</text><rect x="72" y="398" width="375" height="58" rx="29" fill="#dff7a9"/><text x="104" y="436" fill="#173222" font-size="25" font-weight="800">kostenlos · lokal · kopierbar</text></g>
  <g filter="url(#shadow)"><rect x="735" y="114" width="390" height="402" rx="28" fill="#fff"/><text x="773" y="170" fill="#173222" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800">Dein nächster Schritt</text><g font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><circle cx="788" cy="226" r="16" fill="#dff7a9"/><text x="821" y="233" fill="#315046">Angebot versenden</text><circle cx="788" cy="286" r="16" fill="#dff7a9"/><text x="821" y="293" fill="#315046">Sachlich nachfassen</text><circle cx="788" cy="346" r="16" fill="#dff7a9"/><text x="821" y="353" fill="#315046">Umfang klären</text><circle cx="788" cy="406" r="16" fill="#dff7a9"/><text x="821" y="413" fill="#315046">Freundlich schließen</text></g><rect x="773" y="448" width="228" height="42" rx="11" fill="#087466"/><text x="803" y="476" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800">Vorlagen öffnen</text></g>
</svg>
